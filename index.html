<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Saha Su Testi Takip</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { background-color: #121212; color: #fff; font-family: sans-serif; }
        
        /* Üst Menü */
        header { position: sticky; top: 0; background: #222; padding: 10px; z-index: 100; border-bottom: 1px solid #444; }
        .nav-btns { display: flex; gap: 8px; margin-bottom: 8px; }
        .nav-btn { flex: 1; padding: 10px; background: #333; color: white; border: none; border-radius: 6px; font-weight: bold; }
        .nav-btn.active { background: #007aff; }
        
        .stats { display: flex; justify-content: space-around; background: #000; padding: 8px; border-radius: 6px; font-size: 13px; }
        .pass-text { color: #4cd964; font-weight: bold; }
        .fail-text { color: #ff3b30; font-weight: bold; }

        /* Pafta ve Resim Kaplama Alanı */
        .drawing-container { position: relative; width: 100%; overflow: auto; text-align: center; padding: 10px 0; }
        .facade-wrapper { position: relative; display: inline-block; max-width: 100%; }
        .facade-img { display: block; width: 100%; height: auto; max-width: 900px; }
        
        /* Resim Üzerindeki Tıklanabilir Cam SVG Katmanı */
        .svg-overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; }
        
        /* Cam Poligon / Kutu Stilleri */
        .glass-zone {
            fill: rgba(255, 255, 255, 0.01); /* Şeffaf / Görünmez */
            stroke: rgba(0, 122, 255, 0.5); /* Hafif Mavi Çerçeve */
            stroke-width: 1.5;
            cursor: pointer;
            transition: all 0.2s;
        }
        
        .glass-zone.pass { fill: rgba(76, 217, 100, 0.6) !important; stroke: #2e7d32; }
        .glass-zone.fail { fill: rgba(255, 59, 48, 0.6) !important; stroke: #c62828; }
        
        /* Cam Etiket Yazısı */
        .glass-label { font-size: 10px; fill: #fff; font-weight: bold; pointer-events: none; text-anchor: middle; dominant-baseline: middle; }
    </style>
</head>
<body>

<header>
    <div class="nav-btns">
        <button class="nav-btn active" onclick="setFacade(1)">O Blok Cephe</button>
        <button class="nav-btn" onclick="setFacade(2)">Cephe 2</button>
    </div>
    <div class="stats">
        <div>Toplam: <span id="total-val">0</span></div>
        <div>Geçti: <span class="pass-text" id="pass-val">0</span></div>
        <div>Kaldı: <span class="fail-text" id="fail-val">0</span></div>
    </div>
</header>

<div class="drawing-container">
    <div class="facade-wrapper">
        <!-- Paftanın Orijinal Görseli -->
        <img id="facade-image" class="facade-img" src="o_blok_pafta.jpg" alt="Pafta">
        
        <!-- Üzerindeki Cam Şablonları (Koordinat Katmanı) -->
        <svg class="svg-overlay" id="svg-layer" viewBox="0 0 1000 1000" preserveAspectRatio="none">
            <!-- Örnek Cam Kutuları (x, y, genişlik, yükseklik) -->
            <!-- Bu koordinatlar paftanizdaki camlarin tam üzerine ayarlanacaktır -->
            <g id="glass-group"></g>
        </svg>
    </div>
</div>

<script>
    // Pafta üzerindeki camların tam koordinat tanımları (x, y, w, h)
    // Resmi 1000x1000 bir karesel oran kabul ederek camların yerleri tanımlanır
    const glassCoordinates = {
        1: [
            // Kat 1 Camları
            { id: "c1_1", x: 100, y: 150, w: 80, h: 120 },
            { id: "c1_2", x: 200, y: 150, w: 80, h: 120 },
            { id: "c1_3", x: 300, y: 150, w: 80, h: 120 },
            // Kat 2 Camları
            { id: "c2_1", x: 100, y: 300, w: 80, h: 120 },
            { id: "c2_2", x: 200, y: 300, w: 80, h: 120 },
            { id: "c2_3", x: 300, y: 300, w: 80, h: 120 }
        ]
    };

    let testData = JSON.parse(localStorage.getItem('paftaTestData')) || {};
    let currentFacade = 1;

    function renderGlassZones() {
        const group = document.getElementById('glass-group');
        group.innerHTML = '';
        
        const items = glassCoordinates[currentFacade] || [];
        
        items.forEach((item, index) => {
            const status = testData[item.id] || 'none';
            
            // Cam Kutusu
            const rect = document.createElementNS("http://www.w3.org/2000/svg", "rect");
            rect.setAttribute("x", item.x);
            rect.setAttribute("y", item.y);
            rect.setAttribute("width", item.w);
            rect.setAttribute("height", item.h);
            rect.setAttribute("class", `glass-zone ${status}`);
            rect.onclick = () => toggleGlass(item.id);
            
            // Etiket / Durum Yazısı
            const text = document.createElementNS("http://www.w3.org/2000/svg", "text");
            text.setAttribute("x", item.x + (item.w / 2));
            text.setAttribute("y", item.y + (item.h / 2));
            text.setAttribute("class", "glass-label");
            
            if (status === 'pass') text.textContent = "GEÇTİ ✔";
            else if (status === 'fail') text.textContent = "KALDI ✖";
            else text.textContent = `C-${index + 1}`;

            group.appendChild(rect);
            group.appendChild(text);
        });

        updateStats();
    }

    function toggleGlass(id) {
        const current = testData[id] || 'none';
        let next = 'none';
        
        if (current === 'none') next = 'pass';
        else if (current === 'pass') next = 'fail';
        else if (current === 'fail') next = 'none';

        testData[id] = next;
        localStorage.setItem('paftaTestData', JSON.stringify(testData));
        renderGlassZones();
    }

    function setFacade(num) {
        currentFacade = num;
        document.querySelectorAll('.nav-btn').forEach((btn, idx) => {
            btn.classList.toggle('active', idx === num - 1);
        });
        renderGlassZones();
    }

    function updateStats() {
        const items = glassCoordinates[currentFacade] || [];
        let pass = 0, fail = 0;
        
        items.forEach(item => {
            const st = testData[item.id];
            if (st === 'pass') pass++;
            if (st === 'fail') fail++;
        });

        document.getElementById('total-val').innerText = items.length;
        document.getElementById('pass-val').innerText = pass;
        document.getElementById('fail-val').innerText = fail;
    }

    renderGlassZones();
</script>
</body>
</html>
