<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Cephe Su Testi Kontrolü</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background: #f8fafc; color: #0f172a; min-height: 100vh; pb: 20px; }
    
    header { background: #fff; border-b: 1px solid #e2e8f0; position: sticky; top: 0; z-index: 20; padding: 10px 16px; }
    .title { font-size: 16px; font-weight: 800; color: #0f172a; }
    
    .tabs { display: flex; gap: 4px; margin-top: 10px; overflow-x: auto; }
    .tab-btn { flex: 1; padding: 8px 12px; font-size: 11px; font-weight: 700; border: 1px solid #cbd5e1; border-radius: 8px; background: #fff; color: #64748b; white-space: nowrap; cursor: pointer; }
    .tab-btn.active { background: #0f172a; color: #fff; border-color: #0f172a; }

    .stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; padding: 12px; background: #fff; margin: 12px; border-radius: 12px; border: 1px solid #e2e8f0; text-align: center; }
    .stat-box { font-size: 10px; font-weight: 700; color: #64748b; }
    .stat-val { font-size: 15px; font-weight: 900; display: block; margin-top: 2px; }

    .floor-list { padding: 0 12px; display: flex; flex-direction: column; gap: 8px; }
    .floor-row { background: #fff; border: 1px solid #e2e8f0; border-radius: 10px; padding: 8px 12px; }
    .floor-title { font-size: 11px; font-weight: 800; color: #334155; margin-bottom: 6px; border-b: 1px solid #f1f5f9; pb: 4px; }
    
    .glass-grid { display: grid; grid-template-columns: repeat(8, 1fr); gap: 6px; }
    .glass-item { height: 32px; border-radius: 6px; border: 1px solid #cbd5e1; display: flex; align-items: center; justify-content: center; font-size: 10px; font-weight: 800; background: #f1f5f9; color: #475569; cursor: pointer; }
    
    .glass-item.PASSED { background: #22c55e; color: #fff; border-color: #16a34a; }
    .glass-item.FAILED { background: #ef4444; color: #fff; border-color: #dc2626; }

    /* MODAL */
    .modal { position: fixed; inset: 0; background: rgba(0,0,0,0.6); display: none; align-items: center; justify-content: center; z-index: 50; padding: 16px; }
    .modal.show { display: flex; }
    .modal-card { background: #fff; border-radius: 16px; width: 100%; max-width: 320px; padding: 16px; display: flex; flex-direction: column; gap: 10px; }
    .btn { width: 100%; padding: 12px; border-radius: 10px; font-size: 12px; font-weight: 800; border: none; cursor: pointer; }
    .btn-pass { background: #22c55e; color: #fff; }
    .btn-fail { background: #ef4444; color: #fff; }
    .btn-reset { background: #f1f5f9; color: #64748b; border: 1px dashed #cbd5e1; }
    .btn-save { background: #0f172a; color: #fff; margin-top: 6px; }
    textarea { width: 100%; padding: 8px; border-radius: 8px; border: 1px solid #cbd5e1; font-size: 11px; outline: none; }
  </style>
</head>
<body>

  <header>
    <div class="title">Şantiye Su Testi Paneli</div>
    <div class="tabs">
      <button onclick="switchFacade('F1')" id="btn-F1" class="tab-btn active">FACADE-1 (KB)</button>
      <button onclick="switchFacade('F2')" id="btn-F2" class="tab-btn">FACADE-2 (GD)</button>
      <button onclick="switchFacade('F3')" id="btn-F3" class="tab-btn">FACADE-3 (GB)</button>
      <button onclick="switchFacade('F4')" id="btn-F4" class="tab-btn">FACADE-4 (KD)</button>
    </div>
  </header>

  <div class="stats">
    <div class="stat-box">TOPLAM<span id="st-tot" class="stat-val" style="color:#0f172a">0</span></div>
    <div class="stat-box">GEÇTİ<span id="st-pas" class="stat-val" style="color:#22c55e">0</span></div>
    <div class="stat-box">GEÇMEDİ<span id="st-fai" class="stat-val" style="color:#ef4444">0</span></div>
    <div class="stat-box">BEKLEYEN<span id="st-unt" class="stat-val" style="color:#64748b">0</span></div>
  </div>

  <div id="main-container" class="floor-list"></div>

  <!-- MODAL -->
  <div id="modal" class="modal">
    <div class="modal-card">
      <h3 id="m-title" style="font-size:14px; font-weight:800;"></h3>
      <button onclick="setSt('PASSED')" class="btn btn-pass">✅ TESTTEN GEÇTİ</button>
      <button onclick="setSt('FAILED')" class="btn btn-fail">❌ TESTTEN GEÇMEDİ</button>
      <button onclick="setSt('UNTESTED')" class="btn btn-reset">🔄 İPTAL ET / SIFIRLA</button>
      
      <div id="reason-box" style="display:none;">
        <label style="font-size:10px; font-weight:700;">Hata Nedeni:</label>
        <textarea id="reason-text" rows="3" placeholder="Sızıntı detayını yazın..."></textarea>
      </div>

      <button onclick="saveData()" class="btn btn-save">KAYDET</button>
    </div>
  </div>

  <script>
    let curF = 'F1';
    let selId = null;
    let selSt = 'UNTESTED';
    let db = JSON.parse(localStorage.getItem('facade_guaranteed_db')) || {};

    const facadeNames = { 'F1':'FACADE-1 (KUZEYBATI)', 'F2':'FACADE-2 (GÜNEYDOĞU)', 'F3':'FACADE-3 (GÜNEYBATI)', 'F4':'FACADE-4 (KUZEYDOĞU)' };

    window.onload = () => render();

    function switchFacade(id) {
      curF = id;
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      document.getElementById(`btn-${id}`).classList.add('active');
      render();
    }

    function render() {
      const container = document.getElementById('main-container');
      container.innerHTML = '';
      let p=0, f=0, u=0;

      for (let floor = 30; floor >= 1; floor--) {
        const fRow = document.createElement('div');
        fRow.className = 'floor-row';
        
        const fTitle = document.createElement('div');
        fTitle.className = 'floor-title';
        fTitle.innerText = `${floor}. FLOOR`;
        fRow.appendChild(fTitle);

        const grid = document.createElement('div');
        grid.className = 'glass-grid';

        for (let c = 1; c <= 8; c++) {
          const gId = `${curF}-FL${floor}-C${c}`;
          const info = db[gId] || { status: 'UNTESTED' };

          if(info.status === 'PASSED') p++;
          else if(info.status === 'FAILED') f++;
          else u++;

          const item = document.createElement('div');
          item.className = `glass-item ${info.status}`;
          item.innerText = `C${c}`;
          item.onclick = () => openM(gId, floor, c, info);
          grid.appendChild(item);
        }

        fRow.appendChild(grid);
        container.appendChild(fRow);
      }

      document.getElementById('st-tot').innerText = 30 * 8;
      document.getElementById('st-pas').innerText = p;
      document.getElementById('st-fai').innerText = f;
      document.getElementById('st-unt').innerText = u;
    }

    function openM(id, fl, c, info) {
      selId = id;
      selSt = info.status || 'UNTESTED';
      document.getElementById('m-title').innerText = `${facadeNames[curF]} - Kat:${fl} / Cam:C${c}`;
      document.getElementById('reason-text').value = info.reason || '';
      setSt(selSt);
      document.getElementById('modal').classList.add('show');
    }

    function setSt(st) {
      selSt = st;
      document.getElementById('reason-box').style.display = (st === 'FAILED') ? 'block' : 'none';
    }

    function saveData() {
      if(!selId) return;
      if(selSt === 'UNTESTED') {
        delete db[selId];
      } else {
        db[selId] = { status: selSt, reason: document.getElementById('reason-text').value.trim() };
      }
      localStorage.setItem('facade_guaranteed_db', JSON.stringify(db));
      document.getElementById('modal').classList.remove('show');
      render();
    }
  </script>
</body>
</html>
