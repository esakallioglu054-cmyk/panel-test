<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Cephe Su Testi Paftasi</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, sans-serif; user-select: none; }
        body { background-color: #0b0f19; color: #fff; display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
        header { background: #151d2a; padding: 10px 16px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #233044; }
        .tabs { display: flex; gap: 4px; background: #0f172a; padding: 4px; border-radius: 8px; }
        .tab-btn { background: transparent; border: none; color: #94a3b8; padding: 6px 10px; font-size: 11px; font-weight: 600; border-radius: 6px; cursor: pointer; }
        .tab-btn.active { background: #0284c7; color: white; }
        
        .main { flex: 1; position: relative; width: 100%; height: 100%; overflow: hidden; }
        canvas { width: 100%; height: 100%; display: block; background: #020617; touch-action: none; }
        
        .toolbar { position: absolute; top: 12px; left: 12px; z-index: 10; display: flex; gap: 8px; flex-wrap: wrap; }
        .btn { background: #1e293b; border: 1px solid #334155; color: white; padding: 8px 12px; border-radius: 6px; font-size: 11px; font-weight: 600; cursor: pointer; box-shadow: 0 4px 6px rgba(0,0,0,0.3); }
        .btn-primary { background: #0284c7; border-color: #0369a1; }
        
        .controls { position: absolute; bottom: 16px; right: 16px; z-index: 10; display: flex; flex-direction: column; gap: 6px; }
        .btn-ctrl { width: 42px; height: 42px; background: rgba(30, 41, 59, 0.9); border: 1px solid #334155; color: white; border-radius: 8px; font-size: 18px; font-weight: bold; cursor: pointer; }
        input[type="file"] { display: none; }
    </style>
</head>
<body>

    <header>
        <div class="tabs">
            <button class="tab-btn active" onclick="switchFacade(1)">FACADE-1</button>
            <button class="tab-btn" onclick="switchFacade(2)">FACADE-2</button>
            <button class="tab-btn" onclick="switchFacade(3)">FACADE-3</button>
            <button class="tab-btn" onclick="switchFacade(4)">FACADE-4</button>
        </div>
    </header>

    <div class="main" id="canvasContainer">
        <div class="toolbar">
            <button class="btn btn-primary" onclick="document.getElementById('imgInput').click()">🖼️ Pafta Resmi Yükle</button>
            <button class="btn" onclick="document.getElementById('dxfInput').click()">📐 DXF Cam Çerçevelerini Yükle</button>
            <input type="file" id="imgInput" accept="image/*">
            <input type="file" id="dxfInput" accept=".dxf">
        </div>

        <canvas id="paftaCanvas"></canvas>

        <div class="controls">
            <button class="btn-ctrl" onclick="zoom(1.25)">+</button>
            <button class="btn-ctrl" onclick="zoom(0.8)">-</button>
            <button class="btn-ctrl" onclick="fitToScreen()">⟲</button>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('paftaCanvas');
        const ctx = canvas.getContext('2d');
        const container = document.getElementById('canvasContainer');
        
        let activeFacade = 1;
        let bgImages = {};
        let glassPolygons = []; // DXF'den gelen milimetrik cam poligonları
        
        let scale = 1, offsetX = 0, offsetY = 0;
        let isDragging = false, startX = 0, startY = 0;

        function resizeCanvas() {
            canvas.width = container.clientWidth;
            canvas.height = container.clientHeight;
            draw();
        }
        window.addEventListener('resize', resizeCanvas);

        function switchFacade(id) {
            activeFacade = id;
            document.querySelectorAll('.tab-btn').forEach((btn, idx) => {
                btn.classList.toggle('active', idx === id - 1);
            });
            fitToScreen();
        }

        // 1. Görsel Paftasını Arka Plana Yükleme
        document.getElementById('imgInput').addEventListener('change', function(e) {
            let file = e.target.files[0];
            if (!file) return;
            let reader = new FileReader();
            reader.onload = function(evt) {
                let img = new Image();
                img.onload = function() {
                    bgImages[activeFacade] = img;
                    fitToScreen();
                };
                img.src = evt.target.result;
            };
            reader.readAsDataURL(file);
        });

        // 2. DXF Çizimindeki Birebir Cam Çerçevelerini Yükleme
        document.getElementById('dxfInput').addEventListener('change', function(e) {
            let file = e.target.files[0];
            if (!file) return;
            let reader = new FileReader();
            reader.onload = function(evt) { parseDXF(evt.target.result); };
            reader.readAsText(file);
        });

        function parseDXF(text) {
            let lines = text.split(/\r?\n/);
            let inEntities = false, curPoly = [], parsed = [], c = 1;

            for (let i = 0; i < lines.length; i++) {
                let line = lines[i].trim();
                if (line === 'ENTITIES') inEntities = true;
                if (line === 'ENDSEC') inEntities = false;

                if (inEntities) {
                    if (line === 'LWPOLYLINE' || line === 'POLYLINE') {
                        if (curPoly.length >= 3) {
                            parsed.push({ id: `CAM-${c++}`, status: 'PENDING', points: [...curPoly] });
                        }
                        curPoly = [];
                    }
                    if (line === '10') {
                        let x = parseFloat(lines[i+1]);
                        if (lines[i+2] === '20') {
                            let y = parseFloat(lines[i+3]);
                            if (!isNaN(x) && !isNaN(y)) curPoly.push({ x, y });
                        }
                    }
                }
            }
            if (curPoly.length >= 3) parsed.push({ id: `CAM-${c++}`, status: 'PENDING', points: [...curPoly] });

            if (parsed.length > 0) {
                glassPolygons = parsed;
                fitToScreen();
                alert(`${parsed.length} adet cam çerçevesi tam pafta koordinatlarıyla eşleştirildi!`);
            }
        }

        function fitToScreen() {
            let img = bgImages[activeFacade];
            if (img) {
                scale = Math.min(canvas.width / img.width, canvas.height / img.height);
                offsetX = (canvas.width - img.width * scale) / 2;
                offsetY = (canvas.height - img.height * scale) / 2;
            } else if (glassPolygons.length > 0) {
                let minX = Infinity, maxX = -Infinity, minY = Infinity, maxY = -Infinity;
                glassPolygons.forEach(p => p.points.forEach(pt => {
                    if (pt.x < minX) minX = pt.x; if (pt.x > maxX) maxX = pt.x;
                    if (pt.y < minY) minY = pt.y; if (pt.y > maxY) maxY = pt.y;
                }));
                let bw = maxX - minX, bh = maxY - minY;
                scale = Math.min((canvas.width * 0.9) / bw, (canvas.height * 0.9) / bh);
                offsetX = (canvas.width - bw * scale) / 2 - minX * scale;
                offsetY = (canvas.height - bh * scale) / 2 - minY * scale;
            }
            draw();
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            let img = bgImages[activeFacade];
            
            // Pafta Görselini Çiz
            if (img) {
                ctx.drawImage(img, offsetX, offsetY, img.width * scale, img.height * scale);
            }

            // Gerçek Çerçevelere Oturan Cam Kutucuklarını Çiz
            glassPolygons.forEach(p => {
                ctx.beginPath();
                let p0 = toScreen(p.points[0]);
                ctx.moveTo(p0.x, p0.y);
                for (let i = 1; i < p.points.length; i++) {
                    let pt = toScreen(p.points[i]);
                    ctx.lineTo(pt.x, pt.y);
                }
                ctx.closePath();

                if (p.status === 'PASSED') {
                    ctx.fillStyle = 'rgba(34, 197, 94, 0.55)';
                    ctx.strokeStyle = '#22c55e';
                    ctx.lineWidth = 2;
                } else if (p.status === 'FAILED') {
                    ctx.fillStyle = 'rgba(239, 68, 68, 0.65)';
                    ctx.strokeStyle = '#ef4444';
                    ctx.lineWidth = 2;
                } else {
                    ctx.fillStyle = 'rgba(56, 189, 248, 0.15)';
                    ctx.strokeStyle = 'rgba(56, 189, 248, 0.5)';
                    ctx.lineWidth = 1;
                }

                ctx.fill();
                ctx.stroke();
            });
        }

        function toScreen(pt) {
            return { x: pt.x * scale + offsetX, y: canvas.height - (pt.y * scale + offsetY) };
        }
        function toWorld(sx, sy) {
            return { x: (sx - offsetX) / scale, y: (canvas.height - sy - offsetY) / scale };
        }

        // Cam Kutucuklarına Dokunma Etkileşimi
        let lastTap = 0;
        canvas.addEventListener('click', e => {
            let rect = canvas.getBoundingClientRect();
            let clickPt = toWorld(e.clientX - rect.left, e.clientY - rect.top);

            let clickedGlass = glassPolygons.find(p => isPointInPoly(clickPt, p.points));
            if (clickedGlass) {
                let now = Date.now();
                if (now - lastTap < 300) {
                    clickedGlass.status = (clickedGlass.status === 'FAILED') ? 'PENDING' : 'FAILED';
                } else {
                    clickedGlass.status = (clickedGlass.status === 'PASSED') ? 'PENDING' : 'PASSED';
                }
                lastTap = now;
                draw();
            }
        });

        function isPointInPoly(pt, poly) {
            let inside = false;
            for (let i = 0, j = poly.length - 1; i < poly.length; j = i++) {
                let xi = poly[i].x, yi = poly[i].y;
                let xj = poly[j].x, yj = poly[j].y;
                let intersect = ((yi > pt.y) !== (yj > pt.y)) &&
                    (pt.x < (xj - xi) * (pt.y - yi) / (yj - yi) + xi);
                if (intersect) inside = !inside;
            }
            return inside;
        }

        // Yakınlaştırma ve Kaydırma
        function zoom(f) { scale *= f; draw(); }
        container.addEventListener('mousedown', e => { isDragging = true; startX = e.clientX - offsetX; startY = e.clientY - offsetY; });
        window.addEventListener('mousemove', e => { if (isDragging) { offsetX = e.clientX - startX; offsetY = e.clientY - startY; draw(); } });
        window.addEventListener('mouseup', () => { isDragging = false; });

        resizeCanvas();
    </script>
</body>
</html>
