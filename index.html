<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Cephe Su Testi Paftası</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    .glass-box {
      transition: all 0.15s ease;
      cursor: pointer;
    }
    .glass-box:hover {
      opacity: 0.75;
      stroke-width: 2;
    }
    /* Durum Renkleri */
    .status-UNTESTED { fill: #38bdf8; fill-opacity: 0.25; stroke: #0284c7; stroke-width: 1; }
    .status-PASSED { fill: #22c55e; fill-opacity: 0.75; stroke: #15803d; stroke-width: 1.5; }
    .status-FAILED { fill: #ef4444; fill-opacity: 0.85; stroke: #991b1b; stroke-width: 1.5; }
    
    /* Pafta Çizgileri ve Yazıları */
    .floor-text { font-size: 9px; font-weight: 700; fill: #475569; font-family: sans-serif; }
    .axis-text { font-size: 8px; font-weight: 600; fill: #64748b; font-family: sans-serif; }
    .grid-line { stroke: #cbd5e1; stroke-width: 0.5; stroke-dasharray: 2,2; }
  </style>
</head>
<body class="bg-slate-100 text-slate-800 font-sans antialiased min-h-screen flex flex-col selection:bg-none">

  <header class="bg-white border-b border-slate-200 sticky top-0 z-20 shadow-sm">
    <div class="max-w-md mx-auto px-4 py-2.5 flex justify-between items-center">
      <div>
        <h1 class="text-base font-bold text-slate-800 leading-tight">Şantiye Cephe Takip</h1>
        <p class="text-[10px] text-slate-400 font-medium">Su Testi Kontrol Paftası</p>
      </div>
      <span class="text-[10px] bg-emerald-100 text-emerald-800 font-bold px-2 py-0.5 rounded-full">Offline Mod</span>
    </div>
    
    <div class="flex border-t border-slate-100 bg-slate-50 overflow-x-auto text-xs font-bold">
      <button onclick="switchFacade('F1')" id="btn-F1" class="facade-tab flex-1 py-2.5 px-3 text-center border-b-2 border-blue-600 text-blue-600 whitespace-nowrap">FACADE-1 (KB)</button>
      <button onclick="switchFacade('F2')" id="btn-F2" class="facade-tab flex-1 py-2.5 px-3 text-center border-b-2 border-transparent text-slate-500 whitespace-nowrap">FACADE-2 (GD)</button>
      <button onclick="switchFacade('F3')" id="btn-F3" class="facade-tab flex-1 py-2.5 px-3 text-center border-b-2 border-transparent text-slate-500 whitespace-nowrap">FACADE-3 (GB)</button>
      <button onclick="switchFacade('F4')" id="btn-F4" class="facade-tab flex-1 py-2.5 px-3 text-center border-b-2 border-transparent text-slate-500 whitespace-nowrap">FACADE-4 (KD)</button>
    </div>
  </header>

  <main class="flex-1 max-w-md w-full mx-auto p-3 flex flex-col items-center justify-start gap-3">
    
    <div class="w-full bg-white p-2.5 rounded-xl border border-slate-200 shadow-sm grid grid-cols-4 gap-1 text-center text-[11px] font-semibold">
      <div class="bg-slate-50 p-1.5 rounded-lg border border-slate-100">
        <span class="block text-slate-400 text-[9px] uppercase">Toplam</span>
        <span id="stat-total" class="text-sm font-black text-slate-700">0</span>
      </div>
      <div class="bg-emerald-50 p-1.5 rounded-lg border border-emerald-100">
        <span class="block text-emerald-600 text-[9px] uppercase">Geçti</span>
        <span id="stat-passed" class="text-sm font-black text-emerald-600">0</span>
      </div>
      <div class="bg-rose-50 p-1.5 rounded-lg border border-rose-100">
        <span class="block text-rose-600 text-[9px] uppercase">Geçmedi</span>
        <span id="stat-failed" class="text-sm font-black text-rose-600">0</span>
      </div>
      <div class="bg-sky-50 p-1.5 rounded-lg border border-sky-100">
        <span class="block text-sky-600 text-[9px] uppercase">Bekleyen</span>
        <span id="stat-untested" class="text-sm font-black text-sky-600">0</span>
      </div>
    </div>

    <div class="w-full bg-white border border-slate-300 rounded-xl p-2 shadow-inner overflow-auto max-h-[72vh] flex justify-center relative">
      <svg id="facade-svg" width="360" height="980" viewBox="0 0 360 980" class="select-none">
        </svg>
    </div>
  </main>

  <div id="modal" class="fixed inset-0 bg-slate-900/50 backdrop-blur-xs hidden items-center justify-center z-50 p-4">
    <div class="bg-white rounded-2xl max-w-xs w-full p-5 shadow-2xl border border-slate-100 flex flex-col gap-4">
      
      <div class="flex justify-between items-start border-b border-slate-100 pb-3">
        <div>
          <span id="modal-facade-title" class="text-[10px] font-extrabold text-blue-600 uppercase tracking-wider block">FACADE-1</span>
          <h3 id="modal-glass-id" class="font-black text-slate-800 text-lg">30.FLOOR / Zc-1</h3>
        </div>
        <button onclick="closeModal()" class="text-slate-400 hover:text-slate-600 text-xl font-bold p-1 leading-none">✕</button>
      </div>

      <div class="flex flex-col gap-2">
        <button onclick="setStatus('PASSED')" id="btn-status-passed" class="w-full py-3 rounded-xl border-2 border-slate-200 text-slate-600 font-bold text-xs flex items-center justify-center gap-2 transition-all">
          <span>✅</span> TESTTEN GEÇTİ
        </button>
        <button onclick="setStatus('FAILED')" id="btn-status-failed" class="w-full py-3 rounded-xl border-2 border-slate-200 text-slate-600 font-bold text-xs flex items-center justify-center gap-2 transition-all">
          <span>❌</span> TESTTEN GEÇMEDİ
        </button>
        <button onclick="setStatus('UNTESTED')" id="btn-status-untested" class="w-full py-2 rounded-xl border border-dashed border-slate-300 text-slate-400 font-medium text-[11px] hover:bg-slate-50 transition-all">
          🔄 Seçimi İptal Et / Sıfırla
        </button>
      </div>

      <div id="reason-container" class="hidden flex-col gap-1.5">
        <label class="text-[11px] font-bold text-slate-600">Sızdırma / Hata Açıklaması:</label>
        <textarea id="failure-reason" rows="3" placeholder="Sızıntının tam yerini yazınız (Örn: Sol alt fitil birleşimi)..." class="w-full text-xs p-3 border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-rose-500 bg-slate-50 font-medium"></textarea>
      </div>

      <button onclick="saveGlassData()" class="w-full bg-slate-900 text-white font-bold py-3.5 rounded-xl text-xs shadow-lg active:scale-95 transition-transform mt-1">
        KAYDET VE GÜNCELLE
      </button>
    </div>
  </div>

  <script>
    // Paftadaki 30 Kat Modeli
    const TOTAL_FLOORS = 30;
    const COLUMNS_COUNT = 8;
    
    let currentFacade = 'F1';
    let currentSelectedGlassId = null;
    let currentSelectedStatus = 'UNTESTED';

    // Kalıcı Hafıza Yönetimi
    let testData = {};
    try {
      testData = JSON.parse(localStorage.getItem('facade_test_pafta_db')) || {};
    } catch (e) {
      testData = {};
    }

    window.onload = () => {
      renderFacadePafta();
    };

    function switchFacade(facadeId) {
      currentFacade = facadeId;
      document.querySelectorAll('.facade-tab').forEach(btn => {
        btn.classList.remove('border-blue-600', 'text-blue-600');
        btn.classList.add('border-transparent', 'text-slate-500');
      });
      const activeBtn = document.getElementById(`btn-${facadeId}`);
      if(activeBtn) {
        activeBtn.classList.add('border-blue-600', 'text-blue-600');
        activeBtn.classList.remove('border-transparent', 'text-slate-500');
      }
      renderFacadePafta();
    }

    function renderFacadePafta() {
      const svg = document.getElementById('facade-svg');
      if (!svg) return;
      svg.innerHTML = '';

      let passedCount = 0, failedCount = 0, untestedCount = 0;
      
      const startX = 75; // Kat yazıları için sol boşluk
      const startY = 30; // Üst boşluk
      const boxWidth = 32;
      const boxHeight = 26;
      const gapX = 3;
      const gapY = 4;

      // Pafta Alt Dikey Aks Çizgileri ve Kodları (Zc-1 - Zc-8)
      for (let c = 1; c <= COLUMNS_COUNT; c++) {
        const x = startX + (c - 1) * (boxWidth + gapX) + (boxWidth / 2);
        
        const axisText = document.createElementNS('http://www.w3.org/2000/svg', 'text');
        axisText.setAttribute('x', x);
        axisText.setAttribute('y', startY + TOTAL_FLOORS * (boxHeight + gapY) + 18);
        axisText.setAttribute('text-anchor', 'middle');
        axisText.setAttribute('class', 'axis-text');
        axisText.textContent = `Zc-${c}`;
        svg.appendChild(axisText);
      }

      // Katlar ve Cam Hücrelerinin Çizimi (30. Kat En Üstte Olacak Şekilde)
      for (let floor = TOTAL_FLOORS; floor >= 1; floor--) {
        const rowIndex = TOTAL_FLOORS - floor;
        const y = startY + rowIndex * (boxHeight + gapY);

        // Sol Kat İsimleri (Tıpkı Paftadaki gibi: 30.FLOOR)
        const floorText = document.createElementNS('http://www.w3.org/2000/svg', 'text');
        floorText.setAttribute('x', startX - 8);
        floorText.setAttribute('y', y + (boxHeight / 2) + 3);
        floorText.setAttribute('text-anchor', 'end');
        floorText.setAttribute('class', 'floor-text');
        floorText.textContent = `${floor}.FLOOR`;
        svg.appendChild(floorText);

        // Kat Hizalama Çizgisi
        const line = document.createElementNS('http://www.w3.org/2000/svg', 'line');
        line.setAttribute('x1', startX - 4);
        line.setAttribute('y1', y + boxHeight);
        line.setAttribute('x2', startX + COLUMNS_COUNT * (boxWidth + gapX));
        line.setAttribute('y2', y + boxHeight);
        line.setAttribute('class', 'grid-line');
        svg.appendChild(line);

        // Her kattaki 8 Cam Paneli
        for (let col = 1; col <= COLUMNS_COUNT; col++) {
          const glassId = `${currentFacade}-FL${floor}-C${col}`;
          const glassInfo = testData[glassId] || { status: 'UNTESTED', reason: '' };

          if (glassInfo.status === 'PASSED') passedCount++;
          else if (glassInfo.status === 'FAILED') failedCount++;
          else untestedCount++;

          const x = startX + (col - 1) * (boxWidth + gapX);

          const rect = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
          rect.setAttribute('x', x);
          rect.setAttribute('y', y);
          rect.setAttribute('width', boxWidth);
          rect.setAttribute('height', boxHeight);
          rect.setAttribute('rx', '2');
          rect.setAttribute('class', `glass-box status-${glassInfo.status}`);
          
          // Tıklama Olayı
          rect.onclick = () => openModal(glassId, floor, col, glassInfo);

          svg.appendChild(rect);
        }
      }

      // İstatistik Güncelleme
      document.getElementById('stat-total').innerText = TOTAL_FLOORS * COLUMNS_COUNT;
      document.getElementById('stat-passed').innerText = passedCount;
      document.getElementById('stat-failed').innerText = failedCount;
      document.getElementById('stat-untested').innerText = untestedCount;
    }

    function openModal(glassId, floor, col, glassInfo) {
      currentSelectedGlassId = glassId;
      currentSelectedStatus = glassInfo.status || 'UNTESTED';
      
      const facadeNames = { 'F1': 'FACADE-1 (KUZEYBATI)', 'F2': 'FACADE-2 (GÜNEYDOĞU)', 'F3': 'FACADE-3 (GÜNEYBATI)', 'F4': 'FACADE-4 (KUZEYDOĞU)' };
      
      document.getElementById('modal-facade-title').innerText = facadeNames[currentFacade] || currentFacade;
      document.getElementById('modal-glass-id').innerText = `${floor}.FLOOR / Aks: Zc-${col}`;
      document.getElementById('failure-reason').value = glassInfo.reason || '';
      
      setStatus(currentSelectedStatus);
      
      const modal = document.getElementById('modal');
      modal.classList.remove('hidden');
      modal.classList.add('flex');
    }

    function closeModal() {
      const modal = document.getElementById('modal');
      modal.classList.add('hidden');
      modal.classList.remove('flex');
    }

    function setStatus(status) {
      currentSelectedStatus = status;
      
      const btnPassed = document.getElementById('btn-status-passed');
      const btnFailed = document.getElementById('btn-status-failed');
      const btnUntested = document.getElementById('btn-status-untested');
      const reasonContainer = document.getElementById('reason-container');

      // Buton Görünüm Sıfırlama
      btnPassed.className = "w-full py-3 rounded-xl border-2 border-slate-200 text-slate-500 font-bold text-xs flex items-center justify-center gap-2 transition-all";
      btnFailed.className = "w-full py-3 rounded-xl border-2 border-slate-200 text-slate-500 font-bold text-xs flex items-center justify-center gap-2 transition-all";
      btnUntested.className = "w-full py-2 rounded-xl border border-dashed border-slate-300 text-slate-400 font-medium text-[11px] transition-all";

      if (status === 'PASSED') {
        btnPassed.className = "w-full py-3 rounded-xl border-2 border-emerald-500 bg-emerald-50 text-emerald-700 font-bold text-xs flex items-center justify-center gap-2 shadow-sm";
        reasonContainer.classList.add('hidden');
      } else if (status === 'FAILED') {
        btnFailed.className = "w-full py-3 rounded-xl border-2 border-rose-500 bg-rose-50 text-rose-700 font-bold text-xs flex items-center justify-center gap-2 shadow-sm";
        reasonContainer.classList.remove('hidden');
        reasonContainer.classList.add('flex');
      } else {
        // İptal/Sıfırla seçildiğinde
        btnUntested.className = "w-full py-2 rounded-xl border-2 border-slate-400 bg-
