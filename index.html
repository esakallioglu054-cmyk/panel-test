<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Şantiye Cephe Su Testi Paftası</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, sans-serif; user-select: none; }
        body { background-color: #0b0f19; color: #fff; display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
        
        header { background: #151d2a; padding: 10px 12px; display: flex; flex-direction: column; gap: 8px; border-bottom: 1px solid #233044; z-index: 20; }
        .top-bar { display: flex; justify-content: space-between; align-items: center; }
        .title { font-size: 14px; font-weight: 700; color: #38bdf8; }
        
        .tabs { display: flex; gap: 4px; background: #0f172a; padding: 4px; border-radius: 8px; overflow-x: auto; }
        .tab-btn { background: transparent; border: none; color: #94a3b8; padding: 8px 10px; font-size: 11px; font-weight: 700; border-radius: 6px; cursor: pointer; whitespace: nowrap; flex: 1; }
        .tab-btn.active { background: #0284c7; color: white; }
        
        .action-bar { display: flex; gap: 8px; padding: 0 12px 8px 12px; background: #151d2a; }
        .btn-mode { flex: 1; padding: 10px; border-radius: 8px; font-size: 12px; font-weight: bold; border: 2px solid transparent; cursor: pointer; text-align: center; }
        .btn-pass { background: rgba(34, 197, 94, 0.2); border-color: #22c55e; color: #4ade80; }
        .btn-pass.selected { background: #22c55e; color: #000; }
        .btn-fail { background: rgba(239, 68, 68, 0.2); border-color: #ef4444; color: #f87171; }
        .btn-fail.selected { background: #ef4444; color: #fff; }
        .btn-clear { background: #334155; border-color: #475569; color: #fff; flex: 0.6; }

        .main { flex: 1; position: relative; width: 100%; height: 100%; overflow: hidden; }
        canvas { width: 100%; height: 100%; display: block; background: #020617; touch-action: none; }
        
        .controls { position: absolute; bottom: 20px; right: 16px; z-index: 10; display: flex; flex-direction: column; gap: 8px; }
        .btn-ctrl { width: 44px; height: 44px; background: rgba(30, 41, 59, 0.9); border: 1px solid #475569; color: white; border-radius: 10px; font-size: 20px; font-weight: bold; display: flex; align-items: center; justify-content: justify-content: center; backdrop-filter: blur(4px); }
        .btn-ctrl:active { background: #38bdf8; color: #000; }
    </style>
</head>
<body>

    <header>
        <div class="top-bar">
            <div class="title">Şantiye Cephe Su Testi Paftası</div>
            <button class="btn-mode btn-clear" onclick="clearCurrentFacade()">Bu Cepheyi Temizle</button>
        </div>
        <div class="tabs">
            <button class="tab-btn active" onclick="switchFacade(1)">FACADE-1 (KB)</button>
            <button class="tab-btn" onclick="switchFacade(2)">FACADE-2 (GD)</button>
            <button class="tab-btn" onclick="switchFacade(3)">FACADE-3 (GB)</button>
            <button class="tab-btn" onclick="switchFacade(4)">FACADE-4 (KD)</button>
        </div>
    </header>

    <div class="action-bar">
        <button id="btnPass" class="btn-mode btn-pass selected" onclick="setMode('PASSED')">✓ GEÇTİ (YEŞİL)</button>
        <button id="btnFail" class="btn-mode btn-fail" onclick="setMode('FAILED')">✕ GEÇMEDİ (KIRMIZI)</button>
    </div>

    <div class="main" id="canvasContainer">
        <canvas id="paftaCanvas"></canvas>

        <div class="controls">
            <button class="btn-ctrl" onclick="zoom(1.3)">+</button>
            <button class="btn-ctrl" onclick="zoom(0.7)">-</button>
            <button class="btn-ctrl" onclick="fitToScreen()">⟲</button>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('paftaCanvas');
        const ctx = canvas.getContext('2d');
        const container = document.getElementById('canvasContainer');

        let activeFacade = 1;
        let currentMode = 'PASSED';
        
        // Pafta görselleri tanımları
        const facadeImages = {
            1: new Image(),
            2: new Image(),
            3: new Image(),
            4: new Image()
        };
        
        facadeImages[1].src = 'facade1.jpg';
        facadeImages[2].src = 'facade2.jpg';
        facadeImages[3].src = 'facade3.jpg';
        facadeImages[4].src = 'facade4.jpg';

        // Görseller yüklendiğinde otomatik çiz
        Object.keys(facadeImages).forEach(key => {
            facadeImages[key].onload = () => { if (parseInt(key) === activeFacade) fitToScreen(); };
        });

        // Tıklanan ve işaretlenen cam kutucukları kaydı
        let marks = []; 

        let scale = 1, offsetX = 0, offsetY = 0;
        let isDragging = false, startX = 0, startY = 0;
        let lastTouchDist = 0;

        function resizeCanvas() {
            canvas.width = container.clientWidth;
            canvas.height = container.clientHeight;
            draw();
        }
        window.addEventListener('resize', resizeCanvas);

        function setMode(mode) {
            currentMode = mode;
            document.getElementById('btnPass').classList.toggle('selected', mode === 'PASSED');
            document.getElementById('btnFail').classList.toggle('selected', mode === 'FAILED');
        }

        function switchFacade(id) {
            activeFacade = id;
            document.querySelectorAll('.tab-btn').forEach((btn, idx) => {
                btn.classList.toggle('active', idx === id - 1);
            });
            fitToScreen();
        }

        function clearCurrentFacade() {
            if(confirm("Bu cephedeki tüm işaretlemeler silinsin mi?")) {
                marks = marks.filter(m => m.facade !== activeFacade);
                draw();
            }
        }

        function fitToScreen() {
            let img = facadeImages[activeFacade];
            if (!img.complete || img.naturalWidth === 0) {
                draw();
                return;
            }
            scale = Math.min(canvas.width / img.width, canvas.height / img.height);
            offsetX = (canvas.width - img.width * scale) / 2;
            offsetY = (canvas.height - img.height * scale) / 2;
            draw();
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            let img = facadeImages[activeFacade];
            
            // Pafta Görselini Ekrana Bas
            if (img.complete && img.naturalWidth !== 0) {
                ctx.drawImage(img, offsetX, offsetY, img.width * scale, img.height * scale);
            } else {
                ctx.fillStyle = '#94a3b8';
                ctx.font = '14px sans-serif';
                ctx.textAlign = 'center';
                ctx.fillText(`FACADE-${activeFacade} Görseli Yükleniyor veya Bulunamadı...`, canvas.width/2, canvas.height/2);
            }

            // Pafta üzerindeki cam işaretleme kutularını çiz
            marks.filter(m => m.facade === activeFacade).forEach(m => {
                let sx = m.x * scale + offsetX;
                let sy = m.y * scale + offsetY;
                let sw = m.w * scale;
                let sh = m.h * scale;

                if (m.status === 'PASSED') {
                    ctx.fillStyle = 'rgba(34, 197, 94, 0.45)';
                    ctx.strokeStyle = '#22c55e';
                } else {
                    ctx.fillStyle = 'rgba(239, 68, 68, 0.55)';
                    ctx.strokeStyle = '#ef4444';
                }
                ctx.lineWidth = Math.max(1.5, 2 * scale);

                ctx.fillRect(sx, sy, sw, sh);
                ctx.strokeRect(sx, sy, sw, sh);
            });
        }

        // Görsel Üzerinde Cam Alanına Kutucuk Ekleme / Kaldırma Mantığı
        canvas.addEventListener('click', e => {
            if (isDragging) return;
            let rect = canvas.getBoundingClientRect();
            let clickX = (e.clientX - rect.left - offsetX) / scale;
            let clickY = (e.clientY - rect.top - offsetY) / scale;

            // Tıklanan yerde kutu var mı kontrol et
            let existingIdx = marks.findIndex(m => 
                m.facade === activeFacade &&
                clickX >= m.x && clickX <= m.x + m.w &&
                clickY >= m.y && clickY <= m.y + m.h
            );

            if (existingIdx >= 0) {
                // Kutuya tekrar basılırsa durumunu değiştir ya da sil
                if (marks[existingIdx].status === currentMode) {
                    marks.splice(existingIdx, 1); // Aynı moda tekrar tıklanırsa siler
                } else {
                    marks[existingIdx].status = currentMode;
                }
            } else {
                // Yeni Kutu Ekle (Paftadaki standart cam oranına göre ayarlı)
                let boxW = 28; 
                let boxH = 48; 
                marks.push({
                    facade: activeFacade,
                    x: clickX - (boxW / 2),
                    y: clickY - (boxH / 2),
                    w: boxW,
                    h: boxH,
                    status: currentMode
                });
            }
            draw();
        });

        // Zoom ve Dokunmatik Sürükleme
        function zoom(factor) {
            scale *= factor;
            draw();
        }

        container.addEventListener('touchstart', e => {
            if (e.touches.length === 1) {
                isDragging = false;
                startX = e.touches[0].clientX - offsetX;
                startY = e.touches[0].clientY - offsetY;
            } else if (e.touches.length === 2) {
                lastTouchDist = Math.hypot(
                    e.touches[0].clientX - e.touches[1].clientX,
                    e.touches[0].clientY - e.touches[1].clientY
                );
            }
        }, { passive: true });

        container.addEventListener('touchmove', e => {
            if (e.touches.length === 1) {
                isDragging = true;
                offsetX = e.touches[0].clientX - startX;
                offsetY = e.touches[0].clientY - startY;
                draw();
            } else if (e.touches.length === 2) {
                let dist = Math.hypot(
                    e.touches[0].clientX - e.touches[1].clientX,
                    e.touches[0].clientY - e.touches[1].clientY
                );
                if (lastTouchDist > 0) {
                    scale *= (dist / lastTouchDist);
                    draw();
                }
                lastTouchDist = dist;
            }
        }, { passive: true });

        resizeCanvas();
        fitToScreen();
    </script>
</body>
</html>
