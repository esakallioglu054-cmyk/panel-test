<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Şantiye Cephe Görsel İşaretleme</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background: #0f172a; color: #fff; min-height: 100vh; display: flex; flex-direction: column; }
    
    header { background: #1e293b; border-b: 1px solid #334155; position: sticky; top: 0; z-index: 30; }
    .header-top { padding: 10px 14px; display: flex; justify-content: space-between; align-items: center; }
    .title { font-size: 14px; font-weight: 800; color: #f8fafc; }
    
    .tabs { display: flex; background: #0f172a; border-t: 1px solid #334155; overflow-x: auto; }
    .tab-btn { flex: 1; min-width: 90px; padding: 10px; text-align: center; font-size: 11px; font-weight: 800; color: #94a3b8; border: none; background: none; border-bottom: 3px solid transparent; cursor: pointer; white-space: nowrap; }
    .tab-btn.active { color: #38bdf8; border-bottom-color: #38bdf8; background: #1e293b; }

    .mode-selector { display: flex; gap: 6px; padding: 8px 10px; background: #1e293b; border-bottom: 1px solid #334155; }
    .mode-btn { flex: 1; padding: 10px; font-size: 11px; font-weight: 800; border-radius: 8px; border: 2px solid transparent; cursor: pointer; text-align: center; }
    .mode-pass { background: rgba(34, 197, 94, 0.15); color: #4ade80; border-color: #22c55e; }
    .mode-fail { background: rgba(239, 68, 68, 0.15); color: #f87171; border-color: #ef4444; }
    .mode-clear { background: rgba(148, 163, 184, 0.15); color: #cbd5e1; border-color: #64748b; }
    .mode-btn.active { box-shadow: 0 0 10px currentColor; font-weight: 900; background-opacity: 0.4; }

    /* PAFTA VE NOKTA KATMANI */
    .canvas-wrapper { flex: 1; overflow: auto; display: flex; justify-content: center; align-items: flex-start; padding: 10px; }
    .pafta-box { position: relative; display: inline-block; box-shadow: 0 10px 25px rgba(0,0,0,0.5); border-radius: 4px; overflow: hidden; }
    #pafta-img { display: block; max-width: 100%; width: auto; height: auto; user-select: none; -webkit-user-drag: none; }
    
    /* DOKUNMATİK NOKTALAR */
    .marker { position: absolute; width: 14px; height: 14px; border-radius: 50%; transform: translate(-50%, -50%); cursor: pointer; border: 2px solid #fff; box-shadow: 0 0 4px rgba(0,0,0,0.9); }
    .marker.PASSED { background-color: #22c55e; }
    .marker.FAILED { background-color: #ef4444; }

    .footer-stats { display: flex; justify-content: space-around; background: #1e293b; padding: 10px; font-size: 11px; font-weight: 700; border-t: 1px solid #334155; }
    .stat { display: flex; align-items: center; gap: 4px; }
    .dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
  </style>
</head>
<body>

  <header>
    <div class="header-top">
      <div>
        <div class="title">Şantiye Cephe Su Testi Paftası</div>
      </div>
      <button onclick="resetCurrentFacade()" style="background:#ef4444; color:#fff; border:none; padding:6px 10px; font-size:10px; font-weight:800; border-radius:6px; cursor:pointer;">Bu Cepheyi Temizle</button>
    </div>
    
    <div class="tabs">
      <button onclick="switchFacade('F1')" id="btn-F1" class="tab-btn active">FACADE-1 (KB)</button>
      <button onclick="switchFacade('F2')" id="btn-F2" class="tab-btn">FACADE-2 (GD)</button>
      <button onclick="switchFacade('F3')" id="btn-F3" class="tab-btn">FACADE-3 (GB)</button>
      <button onclick="switchFacade('F4')" id="btn-F4" class="tab-btn">FACADE-4 (KD)</button>
    </div>
  </header>

  <!-- İŞARET MODU SEÇİMİ -->
  <div class="mode-selector">
    <div onclick="setMode('PASSED')" id="m-pass" class="mode-btn mode-pass active">✅ GEÇTİ (YEŞİL)</div>
    <div onclick="setMode('FAILED')" id="m-fail" class="mode-btn mode-fail">❌ GEÇMEDİ (KIRMIZI)</div>
    <div onclick="setMode('CLEAR')" id="m-clear" class="mode-btn mode-clear">🧹 SİL</div>
  </div>

  <!-- PAFTA VE DOKUNMA ALANI -->
  <div class="canvas-wrapper">
    <div id="pafta-container" class="pafta-box">
      <img id="pafta-img" src="facade1.jpg" alt="Cephe Paftası" onclick="handleImageClick(event)">
    </div>
  </div>

  <div class="footer-stats">
    <div class="stat"><span class="dot" style="background:#22c55e;"></span> Geçti: <span id="cnt-pass" style="color:#4ade80">0</span></div>
    <div class="stat"><span class="dot" style="background:#ef4444;"></span> Geçmedi: <span id="cnt-fail" style="color:#f87171">0</span></div>
    <div class="stat">Bu Cephe Toplamı: <span id="cnt-tot" style="color:#f8fafc">0</span></div>
  </div>

  <script>
    let currentFacade = 'F1';
    let currentMode = 'PASSED';
    
    const facadeImages = {
      'F1': 'facade1.jpg',
      'F2': 'facade2.jpg',
      'F3': 'facade3.jpg',
      'F4': 'facade4.jpg'
    };

    let allMarkers = JSON.parse(localStorage.getItem('pafta_multi_facade_db')) || { F1: [], F2: [], F3: [], F4: [] };

    window.onload = () => {
      loadFacade();
    };

    function switchFacade(facadeId) {
      currentFacade = facadeId;
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      document.getElementById(`btn-${facadeId}`).classList.add('active');
      
      const img = document.getElementById('pafta-img');
      img.src = facadeImages[facadeId];
      loadFacade();
    }

    function setMode(mode) {
      currentMode = mode;
      document.querySelectorAll('.mode-btn').forEach(b => b.classList.remove('active'));
      if(mode === 'PASSED') document.getElementById('m-pass').classList.add('active');
      if(mode === 'FAILED') document.getElementById('m-fail').classList.add('active');
      if(mode === 'CLEAR') document.getElementById('m-clear').classList.add('active');
    }

    function handleImageClick(event) {
      const img = document.getElementById('pafta-img');
      const rect = img.getBoundingClientRect();
      
      const xPercent = ((event.clientX - rect.left) / rect.width) * 100;
      const yPercent = ((event.clientY - rect.top) / rect.height) * 100;

      if (!allMarkers[currentFacade]) allMarkers[currentFacade] = [];

      if (currentMode === 'CLEAR') {
        allMarkers[currentFacade] = allMarkers[currentFacade].filter(m => {
          const dist = Math.hypot(m.x - xPercent, m.y - yPercent);
          return dist > 2;
        });
      } else {
        allMarkers[currentFacade].push({
          id: Date.now(),
          x: xPercent,
          y: yPercent,
          type: currentMode
        });
      }

      saveAndRender();
    }

    function loadFacade() {
      const img = document.getElementById('pafta-img');
      img.onload = () => renderMarkers();
      if (img.complete) renderMarkers();
    }

    function renderMarkers() {
      const container = document.getElementById('pafta-container');
      document.querySelectorAll('.marker').forEach(m => m.remove());

      let passCnt = 0;
      let failCnt = 0;

      const currentList = allMarkers[currentFacade] || [];

      currentList.forEach(m => {
        const markerDiv = document.createElement('div');
        markerDiv.className = `marker ${m.type}`;
        markerDiv.style.left = `${m.x}%`;
        markerDiv.style.top = `${m.y}%`;
        
        markerDiv.onclick = (e) => {
          e.stopPropagation();
          allMarkers[currentFacade] = allMarkers[currentFacade].filter(item => item.id !== m.id);
          saveAndRender();
        };

        container.appendChild(markerDiv);

        if (m.type === 'PASSED') passCnt++;
        if (m.type === 'FAILED') failCnt++;
      });

      document.getElementById('cnt-pass').innerText = passCnt;
      document.getElementById('cnt-fail').innerText = failCnt;
      document.getElementById('cnt-tot').innerText = currentList.length;
    }

    function saveAndRender() {
      localStorage.setItem('pafta_multi_facade_db', JSON.stringify(allMarkers));
      renderMarkers();
    }

    function resetCurrentFacade() {
      if(confirm(`Seçili olan ${currentFacade} cephesindeki tüm noktaları silmek istediğinize emin misiniz?`)) {
        allMarkers[currentFacade] = [];
        saveAndRender();
      }
    }
  </script>
</body>
</html>
